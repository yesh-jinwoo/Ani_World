<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Create an AniWorld account." /><title>Join AniWorld</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../css/main.css" /><link rel="stylesheet" href="../css/auth.css" /></head>
<body class="auth-page"><main class="auth-layout"><a class="brand auth-brand" href="../index.html"><span class="brand-mark">A</span>Ani<span>World</span></a><section class="auth-card" aria-labelledby="register-title"><p class="eyebrow"><span></span> The gate is open</p><h1 id="register-title">Begin your <em>story.</em></h1><p class="auth-intro">Create your free AniWorld account.</p><div id="form-message" class="form-message" role="alert" hidden></div><form id="register-form" novalidate><label for="username">Username<input id="username" name="username" autocomplete="username" minlength="3" maxlength="150" required /></label><label for="email">Email<input id="email" name="email" type="email" autocomplete="email" required /></label><label for="password">Password<input id="password" name="password" type="password" autocomplete="new-password" required /></label><label for="confirm-password">Confirm password<input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required /></label><button class="button button-primary auth-submit" type="submit">Join AniWorld <span aria-hidden="true">→</span></button></form><div class="auth-divider"><span>or</span></div><button class="google-button" type="button" disabled title="Google OAuth arrives in Phase 5"><span>G</span> Continue with Google <small>Phase 5</small></button><p class="auth-switch">Already a member? <a href="login.html">Log in</a></p></section><p class="auth-back"><a href="../index.html">← Return to AniWorld</a></p></main><script type="module" src="../js/auth/register.js"></script></body></html>
