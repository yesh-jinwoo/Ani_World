<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Sign in to AniWorld." /><title>Log in | AniWorld</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../css/main.css" /><link rel="stylesheet" href="../css/auth.css" /></head>
<body class="auth-page"><main class="auth-layout"><a class="brand auth-brand" href="../index.html"><span class="brand-mark">A</span>Ani<span>World</span></a><section class="auth-card" aria-labelledby="login-title"><p class="eyebrow"><span></span> Return to the guild</p><h1 id="login-title">Welcome <em>back.</em></h1><p class="auth-intro">Sign in and continue your journey.</p><div id="form-message" class="form-message" role="alert" hidden></div><form id="login-form" novalidate><label for="identifier">Email or username<input id="identifier" name="identifier" autocomplete="username" required /></label><label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required /></label><div class="form-row"><label class="check-label" for="remember-me"><input id="remember-me" name="remember_me" type="checkbox" /> Remember me</label><a class="form-link" href="#">Forgot password?</a></div><button class="button button-primary auth-submit" type="submit">Log in <span aria-hidden="true">→</span></button></form><div class="auth-divider"><span>or</span></div><button class="google-button" type="button" disabled title="Google OAuth arrives in Phase 5"><span>G</span> Continue with Google <small>Phase 5</small></button><p class="auth-switch">New to AniWorld? <a href="register.html">Join the guild</a></p></section><p class="auth-back"><a href="../index.html">← Return to AniWorld</a></p></main><script type="module" src="../js/auth/login.js"></script></body></html>
